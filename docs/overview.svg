<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="'Noto Sans', 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <title>Property AI Assistant: system overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #475569; }
      .band-label { font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: 0.04em; }
      .badge { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; }
      .h { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .mono { font-size: 12.5px; fill: #334155; font-family: 'DejaVu Sans Mono', 'Noto Sans Mono', monospace; }
      .small { font-size: 12px; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; }
      .edge-dash { stroke: #15803d; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
      .legend { font-size: 13px; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="54" text-anchor="middle" class="title">Property AI Assistant: System Overview</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">RAG chatbot over web-scraped DarGlobal and Wasalt data · free LLMs via OpenRouter · Docker container on Render</text>

  <!-- ===================== OFFLINE BAND ===================== -->
  <rect x="40" y="115" width="1520" height="345" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="146" class="band-label">OFFLINE · BUILD THE KNOWLEDGE BASE (run by the developer, results committed to git)</text>

  <!-- Sources -->
  <rect x="70" y="175" width="240" height="95" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="190" y="206" text-anchor="middle" class="h">DarGlobal website</text>
  <text x="190" y="229" text-anchor="middle" class="t">darglobal.co.uk</text>
  <text x="190" y="250" text-anchor="middle" class="t">65 project and info pages</text>

  <rect x="70" y="290" width="240" height="130" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="190" y="320" text-anchor="middle" class="h">Wasalt portal</text>
  <text x="190" y="343" text-anchor="middle" class="t">wasalt.sa (Saudi listings)</text>
  <text x="190" y="365" text-anchor="middle" class="t">32 pages · 918 listings</text>
  <text x="190" y="387" text-anchor="middle" class="t">+ public sitemap: 60,000 URLs</text>

  <!-- Web scraping -->
  <rect x="360" y="215" width="230" height="150" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.2"/>
  <text x="475" y="241" text-anchor="middle" class="badge" fill="#b45309">WEB SCRAPING</text>
  <text x="475" y="270" text-anchor="middle" class="h">Browser extractors</text>
  <text x="475" y="292" text-anchor="middle" class="t">+ sitemap script (Python)</text>
  <text x="475" y="320" text-anchor="middle" class="small">robots.txt respected,</text>
  <text x="475" y="339" text-anchor="middle" class="small">polite rate, no bypassing</text>

  <path d="M310,222 L357,262" class="edge" marker-end="url(#arrow)"/>
  <path d="M310,355 L357,318" class="edge" marker-end="url(#arrow)"/>

  <!-- Raw data -->
  <path d="M640,247 A85,12 0 0,1 810,247 V333 A85,12 0 0,1 640,333 Z" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <path d="M640,247 A85,12 0 0,0 810,247" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <text x="725" y="290" text-anchor="middle" class="h">Raw data</text>
  <text x="725" y="313" text-anchor="middle" class="mono">data/raw/*.json</text>
  <path d="M590,290 L637,290" class="edge" marker-end="url(#arrow)"/>

  <!-- Data pipeline -->
  <rect x="860" y="215" width="210" height="150" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="965" y="241" text-anchor="middle" class="badge" fill="#15803d">DATA PIPELINE</text>
  <text x="965" y="272" text-anchor="middle" class="h">Clean · dedupe</text>
  <text x="965" y="294" text-anchor="middle" class="t">chunk · normalise</text>
  <text x="965" y="326" text-anchor="middle" class="t" font-weight="700" fill="#15803d">→ 1,484 documents</text>
  <path d="M810,290 L857,290" class="edge" marker-end="url(#arrow)"/>

  <!-- Embedding model -->
  <rect x="1120" y="215" width="210" height="150" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1225" y="241" text-anchor="middle" class="badge" fill="#6d28d9">EMBEDDING MODEL</text>
  <text x="1225" y="270" text-anchor="middle" class="h">bge-small-en-v1.5</text>
  <text x="1225" y="292" text-anchor="middle" class="t">BAAI · via fastembed</text>
  <text x="1225" y="313" text-anchor="middle" class="t">ONNX on CPU, free</text>
  <text x="1225" y="338" text-anchor="middle" class="t">→ 384-number vectors</text>
  <path d="M1070,290 L1117,290" class="edge" marker-end="url(#arrow)"/>

  <!-- Search index -->
  <path d="M1380,217 A85,12 0 0,1 1550,217 V363 A85,12 0 0,1 1380,363 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="2.2"/>
  <path d="M1380,217 A85,12 0 0,0 1550,217" fill="none" stroke="#15803d" stroke-width="2.2"/>
  <text x="1465" y="252" text-anchor="middle" class="badge" fill="#15803d">SEARCH INDEX</text>
  <text x="1465" y="280" text-anchor="middle" class="mono">documents.jsonl</text>
  <text x="1465" y="301" text-anchor="middle" class="mono">embeddings.npy</text>
  <text x="1465" y="329" text-anchor="middle" class="t" font-weight="700">No database:</text>
  <text x="1465" y="348" text-anchor="middle" class="t">plain files in git</text>
  <path d="M1330,290 L1377,290" class="edge" marker-end="url(#arrow)"/>

  <!-- ===================== ONLINE BAND ===================== -->
  <rect x="40" y="500" width="1520" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="531" class="band-label">ONLINE · ANSWER QUESTIONS (live: property-ai-assistant.onrender.com)</text>

  <!-- User -->
  <rect x="70" y="645" width="170" height="125" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
  <text x="155" y="698" text-anchor="middle" class="h">User</text>
  <text x="155" y="722" text-anchor="middle" class="t">web browser</text>
  <text x="155" y="742" text-anchor="middle" class="t">or phone</text>

  <!-- Docker container -->
  <rect x="285" y="560" width="910" height="380" rx="16" fill="#eff6ff" stroke="#1d63ed" stroke-width="2.6"/>
  <text x="305" y="589" class="badge" fill="#1d63ed" font-size="13">DOCKER CONTAINER</text>
  <text x="462" y="589" class="small">·  hosted on Render · non-root · health-checked</text>

  <!-- UI -->
  <rect x="310" y="615" width="205" height="115" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6"/>
  <text x="412" y="640" text-anchor="middle" class="badge" fill="#1d63ed">WEB UI</text>
  <text x="412" y="667" text-anchor="middle" class="h">Chat page</text>
  <text x="412" y="689" text-anchor="middle" class="t">HTML + JavaScript</text>
  <text x="412" y="709" text-anchor="middle" class="t">answer + clickable sources</text>

  <!-- API -->
  <rect x="310" y="770" width="205" height="115" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6"/>
  <text x="412" y="795" text-anchor="middle" class="badge" fill="#1d63ed">BACKEND API</text>
  <text x="412" y="822" text-anchor="middle" class="h">FastAPI + Uvicorn</text>
  <text x="412" y="844" text-anchor="middle" class="mono">POST /api/chat</text>
  <text x="412" y="864" text-anchor="middle" class="t">validation · rate limit</text>

  <path d="M240,700 L307,676" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M412,733 L412,767" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- RAG engine -->
  <rect x="545" y="600" width="625" height="295" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="2.2"/>
  <text x="565" y="627" class="badge" fill="#6d28d9" font-size="13">RAG ENGINE</text>
  <text x="663" y="627" class="small">Retrieval-Augmented Generation</text>

  <rect x="565" y="648" width="180" height="120" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="655" y="672" text-anchor="middle" class="badge" fill="#6d28d9">1 · UNDERSTAND</text>
  <text x="655" y="699" text-anchor="middle" class="h" font-size="15">Parse filters</text>
  <text x="655" y="722" text-anchor="middle" class="small">city · sale/rent · type</text>
  <text x="655" y="741" text-anchor="middle" class="small">bedrooms · budget</text>

  <rect x="765" y="648" width="180" height="120" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="855" y="672" text-anchor="middle" class="badge" fill="#6d28d9">2 · RETRIEVE</text>
  <text x="855" y="699" text-anchor="middle" class="h" font-size="15">Hybrid search</text>
  <text x="855" y="722" text-anchor="middle" class="small">BM25 keywords +</text>
  <text x="855" y="741" text-anchor="middle" class="small">vector similarity (RRF)</text>

  <rect x="965" y="648" width="185" height="120" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1057" y="672" text-anchor="middle" class="badge" fill="#6d28d9">3 · AUGMENT</text>
  <text x="1057" y="699" text-anchor="middle" class="h" font-size="15">Build prompt</text>
  <text x="1057" y="722" text-anchor="middle" class="small">rules + question +</text>
  <text x="1057" y="741" text-anchor="middle" class="small">top-8 cited sources</text>

  <path d="M745,708 L762,708" class="edge" marker-end="url(#arrow)"/>
  <path d="M945,708 L962,708" class="edge" marker-end="url(#arrow)"/>

  <!-- index in memory -->
  <path d="M765,805 A90,10 0 0,1 945,805 V872 A90,10 0 0,1 765,872 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <path d="M765,805 A90,10 0 0,0 945,805" fill="none" stroke="#15803d" stroke-width="1.6"/>
  <text x="855" y="840" text-anchor="middle" class="t" font-weight="700">Index in memory</text>
  <text x="855" y="859" text-anchor="middle" class="small">BM25 + vectors</text>
  <path d="M855,797 L855,771" class="edge" marker-end="url(#arrow)"/>

  <!-- API to step 1 -->
  <path d="M515,827 H655 V771" class="edge" marker-end="url(#arrow)"/>

  <!-- OpenRouter -->
  <rect x="1245" y="600" width="290" height="125" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="1390" y="627" text-anchor="middle" class="badge" fill="#0f766e">OPENROUTER API</text>
  <text x="1390" y="655" text-anchor="middle" class="h">One API, many models</text>
  <text x="1390" y="678" text-anchor="middle" class="t">streaming · model fallback</text>
  <text x="1390" y="698" text-anchor="middle" class="t">60 s cool-down if rate-limited</text>

  <!-- LLMs -->
  <rect x="1245" y="765" width="290" height="160" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="1390" y="792" text-anchor="middle" class="badge" fill="#0f766e">FREE LLMs · 4 · GENERATE</text>
  <text x="1390" y="820" text-anchor="middle" class="h" font-size="15">NVIDIA Nemotron 3 Ultra</text>
  <text x="1390" y="842" text-anchor="middle" class="t">fallbacks: Nemotron 3.5 Super, Gemma 4</text>
  <text x="1390" y="870" text-anchor="middle" class="t">answers only from the sources,</text>
  <text x="1390" y="890" text-anchor="middle" class="t">with [n] citations</text>

  <path d="M1150,690 L1242,665" class="edge" marker-end="url(#arrow)"/>
  <text x="1212" y="657" text-anchor="middle" class="small">prompt</text>
  <path d="M1390,725 L1390,762" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- streamed answer back -->
  <path d="M1245,905 H1210 V915 H412 V888" class="edge" marker-end="url(#arrow)"/>
  <text x="800" y="934" text-anchor="middle" class="small" font-style="italic">answer streamed back word by word (Server-Sent Events), then shown with its sources</text>

  <!-- index copied into image -->
  <path d="M1465,375 V487 H1100 V557" class="edge-dash" marker-end="url(#arrow)"/>
  <text x="1290" y="479" text-anchor="middle" class="small" font-style="italic" fill="#15803d">copied into the Docker image at build time</text>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(150,995)">
    <rect x="0" y="-14" width="18" height="18" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
    <text x="26" y="0" class="legend">Web-scraped data</text>
    <rect x="200" y="-14" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
    <text x="226" y="0" class="legend">Pipeline and index (files, no DB)</text>
    <rect x="490" y="-14" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="516" y="0" class="legend">Embeddings and RAG</text>
    <rect x="700" y="-14" width="18" height="18" rx="4" fill="#eff6ff" stroke="#1d63ed" stroke-width="1.8"/>
    <text x="726" y="0" class="legend">Docker container (FastAPI + UI)</text>
    <rect x="985" y="-14" width="18" height="18" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="1011" y="0" class="legend">OpenRouter and LLMs</text>
  </g>
</svg>
