[project]
name = "property-ai-assistant"
version = "1.0.0"
description = "RAG chatbot over DarGlobal projects and Wasalt listings, powered by a free OpenRouter model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<0.3",
    "fastembed>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "E501"]  # asserts in tests; line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
